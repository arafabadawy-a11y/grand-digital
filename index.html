.card{

.card h3{color:#075579;font-size:22px;margin-bottom:8px}

.about{

.about-inner{
max-width:950px;

text-align:center

.portfolio{

color:#fff

.portfolio .title h2{color:#fff}
.portfolio .title p{color:#d8f8fc}

.portfolio-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

justify-content:center;
text-align:center;
background:#ffffff18;

}
